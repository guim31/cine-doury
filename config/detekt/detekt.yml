# Overrides on top of the detekt default configuration (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    # Test names are sentences between backticks.
    excludes: ['**/test/**', '**/integrationTest/**', '**/testFixtures/**']
  MatchingDeclarationName:
    # A Compose file holds several composables beside a single small type (an enum, a data class).
    active: false
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

complexity:
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    # A `when` that dispatches a route or an error to its screen is one decision, not sixteen.
    ignoreSimpleWhenEntries: true
    # A screen lays out its states; splitting it would only scatter the layout.
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true
    thresholdInFiles: 20
    # The actions a screen asks of its view model: one per gesture.
    thresholdInInterfaces: 15
    # A test class has one function per case; a fake implements a whole interface.
    excludes: ['**/test/**', '**/integrationTest/**', '**/testFixtures/**']

style:
  MagicNumber:
    # Design tokens and test fixtures are numbers by nature.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/integrationTest/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 3
