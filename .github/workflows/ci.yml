name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, static analysis, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          # Keeps the end of the log for the failure summary.
          add-job-summary: never
      - name: Robolectric cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Spotless, Detekt, Android Lint, unit tests, debug and optimised APKs
        run: |
          set -o pipefail
          ./gradlew check :app:tv:assembleDebug :app:tv:assembleRelease :benchmark:assembleBenchmarkRelease \
            --continue 2>&1 | tee gradle.log
      - name: What the optimised APK holds (32-bit libraries for the Chromecast, size)
        run: ci/check-apk.sh app/tv/build/outputs/apk/release/*.apk
      - name: Room schemas are up to date
        run: |
          if [ -n "$(git status --porcelain core/data/schemas)" ]; then
            git status --porcelain core/data/schemas
            echo "::error::core/data/schemas differs from the entities: commit the exported schema"
            exit 1
          fi
      - name: Failure summary
        if: failure()
        run: ci/failure-summary.sh gradle.log
      - name: Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: cine-doury-debug-apk
          path: app/tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # R8, Baseline and Startup Profiles; signed with the debug key until the release key of J7, so
      # that it installs over the debug APK (SPEC.md § 4.16).
      - name: Optimised APK
        uses: actions/upload-artifact@v7
        with:
          name: cine-doury-release-apk
          path: |
            app/tv/build/outputs/apk/release/*.apk
            app/tv/build/outputs/mapping/release/
          if-no-files-found: error
      - name: Benchmark APK
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-apk
          path: benchmark/build/outputs/apk/benchmarkRelease/*.apk
          if-no-files-found: error
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/

  screenshots:
    name: Roborazzi screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # Only used to commit references when the head commit asks for it with [record-screenshots].
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          # Keeps the end of the log for the failure summary.
          add-job-summary: never
      - name: Robolectric cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Mode
        id: mode
        run: |
          if git log -1 --format=%B | grep -qF '[record-screenshots]' \
             && [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "record=true" >> "$GITHUB_OUTPUT"
          else
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify against the references
        if: steps.mode.outputs.record != 'true'
        run: |
          set -o pipefail
          ./gradlew :app:tv:verifyRoborazziDebug 2>&1 | tee gradle.log
      - name: Record the references
        if: steps.mode.outputs.record == 'true'
        run: |
          set -o pipefail
          ./gradlew :app:tv:recordRoborazziDebug 2>&1 | tee gradle.log
      - name: Commit the references
        if: steps.mode.outputs.record == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p docs/screenshots/j8
          # The screens of J8 (180 to 198): the key screens in 4K, then with the largest text.
          cp app/tv/src/test/screenshots/1[89][0-9]-*.png docs/screenshots/j8/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/tv/src/test/screenshots docs/screenshots/j8
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "chore: record reference screenshots"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
      - name: Failure summary
        if: failure()
        run: ci/failure-summary.sh gradle.log
      - name: Screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            app/tv/src/test/screenshots/
            app/tv/build/outputs/roborazzi/
          if-no-files-found: ignore

  integration:
    name: Integration tests against Jellyfin 12.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      jellyfin:
        image: jellyfin/jellyfin:12.3.20261023-013714
        ports:
          - 8096:8096
        volumes:
          - /tmp/cine-doury-media:/media
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          # Keeps the end of the log for the failure summary.
          add-job-summary: never
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Generate the test media
        run: |
          sudo chown -R "$(id -u):$(id -g)" /tmp/cine-doury-media
          ci/jellyfin/generate-media.sh /tmp/cine-doury-media
      - name: Bootstrap Jellyfin
        run: ci/jellyfin/bootstrap.sh http://localhost:8096
      - name: OpenAPI matches docs/api
        run: |
          curl -fsS http://localhost:8096/api-docs/openapi.json > /tmp/openapi.json
          python3 ci/jellyfin/check-openapi.py docs/api/jellyfin-openapi-12.3.json /tmp/openapi.json \
            || { echo "::error::docs/api/jellyfin-openapi-12.3.json differs from the server"; exit 1; }
      - name: Integration tests
        env:
          JELLYFIN_URL: http://localhost:8096
          # The folder the server reads as /media: the management tests make (and delete) a film there.
          JELLYFIN_MEDIA_DIR: /tmp/cine-doury-media
        run: |
          set -o pipefail
          ./gradlew :source:jellyfin:integrationTest 2>&1 | tee gradle.log
      - name: Failure summary
        if: failure()
        run: ci/failure-summary.sh gradle.log
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports
          path: source/jellyfin/build/reports/tests/integrationTest/
          if-no-files-found: ignore

  emulator:
    name: Install, start, play and sign in (debug and optimised APKs) on an API ${{ matrix.api-level }} TV emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # 30: minSdk, Android 11 (NVIDIA Shield TV, the reference device). 34: Chromecast with Google TV.
        api-level: [30, 34]
    services:
      jellyfin:
        image: jellyfin/jellyfin:12.3.20261023-013714
        ports:
          - 8096:8096
        volumes:
          - /tmp/cine-doury-media:/media
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cine-doury-debug-apk
          path: apk
      - uses: actions/download-artifact@v8
        with:
          name: cine-doury-release-apk
          path: release-apk
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-apk
          path: benchmark-apk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: never
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Generate the test media
        run: |
          sudo chown -R "$(id -u):$(id -g)" /tmp/cine-doury-media
          ci/jellyfin/generate-media.sh /tmp/cine-doury-media
      - name: Bootstrap Jellyfin
        run: ci/jellyfin/bootstrap.sh http://localhost:8096
      - name: Build the instrumented tests
        run: |
          set -o pipefail
          ./gradlew :app:tv:assembleDebugAndroidTest 2>&1 | tee gradle.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app, then play
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The emulator reaches the Jellyfin of the host at 10.0.2.2.
          script: |
            ci/emulator-smoke.sh apk
            ci/emulator-playback.sh http://10.0.2.2:8096
            ci/emulator-signin.sh http://10.0.2.2:8096
            ci/emulator-release.sh http://10.0.2.2:8096
            [ "${{ matrix.api-level }}" != 34 ] || ci/couch-gestures.sh "$(adb get-serialno)" --out couch-gestures.md
      - name: Couch gestures (indicative on an emulator)
        if: always() && hashFiles('couch-gestures.md') != ''
        run: cat couch-gestures.md >> "$GITHUB_STEP_SUMMARY"
      - name: Failure summary
        if: failure()
        run: ci/failure-summary.sh gradle.log
      - name: Emulator screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-api${{ matrix.api-level }}
          path: |
            emulator-start.png
            emulator-playback.txt
            emulator-signin.txt
            emulator-signin.png
            emulator-input.txt
            emulator-logcat.txt
            emulator-release.txt
            emulator-release.png
            emulator-release-logcat.txt
            couch-gestures.md
          if-no-files-found: ignore

  profiles:
    name: Baseline Profile and benchmarks on an API 34 TV emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # A commit to measure as "before" on the same emulator as the app now, for a PR that compares
      # (perf/fluidite used 6010840b06f331a9f8e7882173904968d6dcb326, SPEC.md § 4.16). Empty: only
      # the app now. J8 compares with main after J7 (the cost of the effects, SPEC.md § 4.20); to
      # empty again once J8 is merged.
      BEFORE_REF: 962c5f48dc96142cb38c268dd7832d9a89d10c29
    permissions:
      # Only used to commit the profiles when the head commit asks for it with [record-profiles].
      contents: write
    services:
      jellyfin:
        image: jellyfin/jellyfin:12.3.20261023-013714
        ports:
          - 8096:8096
        volumes:
          - /tmp/cine-doury-media:/media
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: cine-doury-debug-apk
          path: apk
      - uses: actions/download-artifact@v8
        with:
          name: cine-doury-release-apk
          path: release-apk
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-apk
          path: benchmark-apk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: never
      - name: Mode
        id: mode
        run: |
          if git log -1 --format=%B | grep -qF '[record-profiles]' \
             && [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "record=true" >> "$GITHUB_OUTPUT"
          else
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Generate the test media
        run: |
          sudo chown -R "$(id -u):$(id -g)" /tmp/cine-doury-media
          ci/jellyfin/generate-media.sh /tmp/cine-doury-media
      - name: Bootstrap Jellyfin
        run: ci/jellyfin/bootstrap.sh http://localhost:8096
      - name: The APKs before the change
        if: env.BEFORE_REF != ''
        run: |
          set -o pipefail
          git fetch --depth 1 origin "$BEFORE_REF"
          git worktree add ../before "$BEFORE_REF"
          cp local.properties ../before/ 2> /dev/null || true
          (cd ../before && ./gradlew :app:tv:assembleDebug :app:tv:assembleRelease) 2>&1 | tee gradle.log
          mkdir -p before-debug-apk before-release-apk
          cp ../before/app/tv/build/outputs/apk/debug/*.apk before-debug-apk/
          cp ../before/app/tv/build/outputs/apk/release/*.apk before-release-apk/
          ci/check-apk.sh before-release-apk/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The profiles (committed on [record-profiles]), then the same emulator measures the debug APK
      # (what was installed before) and the optimised one.
      - name: Profiles, then benchmarks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ci/emulator-perf.sh http://10.0.2.2:8096
      # The profiles are committed once generated, whatever the benchmarks after them say.
      - name: Commit the profiles
        if: always() && steps.mode.outputs.record == 'true' && hashFiles('app/tv/src/release/generated/baselineProfiles/baseline-prof.txt') != ''
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/tv/src/release/generated/baselineProfiles
          if git diff --cached --quiet; then
            echo "Profiles unchanged."
          else
            git commit -m "chore: record baseline and startup profiles"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
      - name: Failure summary
        if: failure()
        run: ci/failure-summary.sh gradle.log
      - name: Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-and-profiles
          path: |
            benchmark-*/
            app/tv/src/release/generated/baselineProfiles/
          if-no-files-found: ignore
